[project]
name = "spice_result_parser"
version = "0.1.0"
description = "A low-memory parser for HSPICE and Nutmeg (ngspice/SPICE3) simulation result files, with an MCP server for agents."
readme = "README.md"
requires-python = ">= 3.9"
license = {file = "LICENSE"}
license-files = ["LICENSE", "LICENSE.MIT"]
authors = [
    {name = "Gonzalez, Raffa", email = "rcgonzalez@g.hmc.edu"},
    {name = "Spencer, Matthew", email = "mespence@gmail.com"}
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
plot = ["matplotlib>=3.5"]

[project.scripts]
srp-parser = "spice_result_parser:convert"
srp-mcp = "spice_result_parser.mcp_server:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatchling.build.targets.wheel]
packages = ["src/spice_result_parser"]
