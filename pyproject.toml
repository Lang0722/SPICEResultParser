[project]
name = "hspice_parser"
version = "0.1.0"
description = "A parser for HSPICE simulation output files."
readme = "README.md"
requires-python = ">= 3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Gonzalez, Raffa", email = "rcgonzalez@g.hmc.edu"},
    {name = "Spencer, Matthew", email = "mespence@gmail.com"}
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
hsp-parser = "hspice_parser:convert"
hsp-mcp = "hspice_parser.mcp_server:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatchling.build.targets.wheel]
packages = ["src/hspice_parser"]
